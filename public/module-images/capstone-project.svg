<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <!-- Background -->
    <rect width="640" height="360" fill="#0F1117"/>

    <!-- Gradient overlay for depth -->
    <defs>
        <radialGradient id="grad-capstone-project" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Gradient -->
    <rect width="640" height="360" fill="url(#grad-capstone-project)"/>

    <!-- Icon -->
    
            <g id="trophy-icon" transform="translate(280, 160)">
                <path d="M -30 -30 L -30 10 Q -30 40 0 45 Q 30 40 30 10 L 30 -30" fill="#0066FF" opacity="0.3"/>
                <path d="M -30 -30 L -30 10 Q -30 40 0 45 Q 30 40 30 10 L 30 -30" fill="none" stroke="#0066FF" stroke-width="2"/>
                <rect x="-40" y="-35" width="80" height="8" fill="#0066FF" opacity="0.3" rx="2"/>
                <line x1="-15" y1="45" x2="-15" y2="30" stroke="#0066FF" stroke-width="2"/>
                <line x1="15" y1="45" x2="15" y2="30" stroke="#0066FF" stroke-width="2"/>
                <path d="M -20 20 L 0 10 L 20 20" fill="#0066FF" opacity="0.5"/>
            </g>
        

    <!-- Bottom accent line -->
    <line x1="50" y1="330" x2="590" y2="330" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
</svg>