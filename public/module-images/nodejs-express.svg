<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <!-- Background -->
    <rect width="640" height="360" fill="#0F1117"/>

    <!-- Gradient overlay for depth -->
    <defs>
        <radialGradient id="grad-nodejs-express" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Gradient -->
    <rect width="640" height="360" fill="url(#grad-nodejs-express)"/>

    <!-- Icon -->
    
            <g id="server-icon" transform="translate(280, 160)">
                <rect x="-50" y="-50" width="100" height="25" fill="#0066FF" opacity="0.3" rx="2"/>
                <rect x="-50" y="-20" width="100" height="25" fill="#0066FF" opacity="0.5" rx="2"/>
                <rect x="-50" y="10" width="100" height="25" fill="#0066FF" opacity="0.3" rx="2"/>
                <circle cx="-35" cy="-37" r="3" fill="#0066FF"/>
                <circle cx="-35" cy="-7" r="3" fill="#0066FF"/>
                <circle cx="-35" cy="23" r="3" fill="#0066FF"/>
            </g>
        

    <!-- Bottom accent line -->
    <line x1="50" y1="330" x2="590" y2="330" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
</svg>