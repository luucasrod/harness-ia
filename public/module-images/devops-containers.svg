<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <!-- Background -->
    <rect width="640" height="360" fill="#0F1117"/>

    <!-- Gradient overlay for depth -->
    <defs>
        <radialGradient id="grad-devops-containers" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Gradient -->
    <rect width="640" height="360" fill="url(#grad-devops-containers)"/>

    <!-- Icon -->
    
            <g id="containers-icon" transform="translate(280, 160)">
                <rect x="-55" y="-40" width="45" height="80" fill="#0066FF" opacity="0.3" rx="3"/>
                <rect x="10" y="-40" width="45" height="80" fill="#0066FF" opacity="0.5" rx="3"/>
                <line x1="-55" y1="-20" x2="55" y2="-20" stroke="#0066FF" stroke-width="1" opacity="0.3"/>
                <line x1="-55" y1="0" x2="55" y2="0" stroke="#0066FF" stroke-width="1" opacity="0.3"/>
                <line x1="-55" y1="20" x2="55" y2="20" stroke="#0066FF" stroke-width="1" opacity="0.3"/>
            </g>
        

    <!-- Bottom accent line -->
    <line x1="50" y1="330" x2="590" y2="330" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
</svg>