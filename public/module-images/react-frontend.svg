<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <!-- Background -->
    <rect width="640" height="360" fill="#0F1117"/>

    <!-- Gradient overlay for depth -->
    <defs>
        <radialGradient id="grad-react-frontend" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Gradient -->
    <rect width="640" height="360" fill="url(#grad-react-frontend)"/>

    <!-- Icon -->
    
            <g id="components-icon" transform="translate(280, 160)">
                <rect x="-50" y="-40" width="40" height="40" fill="#0066FF" opacity="0.3" rx="4"/>
                <rect x="10" y="-40" width="40" height="40" fill="#0066FF" opacity="0.5" rx="4"/>
                <rect x="-30" y="10" width="60" height="30" fill="#0066FF" opacity="0.3" rx="4"/>
                <rect x="-50" y="-40" width="40" height="40" fill="none" stroke="#0066FF" stroke-width="2" rx="4"/>
                <rect x="10" y="-40" width="40" height="40" fill="none" stroke="#0066FF" stroke-width="2" rx="4"/>
                <rect x="-30" y="10" width="60" height="30" fill="none" stroke="#0066FF" stroke-width="2" rx="4"/>
            </g>
        

    <!-- Bottom accent line -->
    <line x1="50" y1="330" x2="590" y2="330" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
</svg>