<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <!-- Background -->
    <rect width="640" height="360" fill="#0F1117"/>

    <!-- Gradient overlay for depth -->
    <defs>
        <radialGradient id="grad-caching-realtime" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Gradient -->
    <rect width="640" height="360" fill="url(#grad-caching-realtime)"/>

    <!-- Icon -->
    
            <g id="lightning-icon" transform="translate(280, 160)">
                <path d="M 0 -50 L -20 -10 L 10 -10 L -10 40 L 30 0 L 0 0 Z" fill="#0066FF" opacity="0.5"/>
                <path d="M 0 -50 L -20 -10 L 10 -10 L -10 40 L 30 0 L 0 0 Z" fill="none" stroke="#0066FF" stroke-width="2"/>
                <circle cx="0" cy="0" r="60" fill="none" stroke="#0066FF" stroke-width="1" opacity="0.2"/>
            </g>
        

    <!-- Bottom accent line -->
    <line x1="50" y1="330" x2="590" y2="330" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
</svg>