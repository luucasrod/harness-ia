<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <!-- Background -->
    <rect width="640" height="360" fill="#0F1117"/>

    <!-- Gradient overlay for depth -->
    <defs>
        <radialGradient id="grad-system-design" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Gradient -->
    <rect width="640" height="360" fill="url(#grad-system-design)"/>

    <!-- Icon -->
    
            <g id="architecture-icon" transform="translate(280, 160)">
                <rect x="-60" y="-50" width="40" height="40" fill="#0066FF" opacity="0.3"/>
                <rect x="20" y="-50" width="40" height="40" fill="#0066FF" opacity="0.3"/>
                <rect x="-20" y="10" width="40" height="40" fill="#0066FF" opacity="0.5"/>
                <line x1="-40" y1="-10" x2="-20" y2="10" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
                <line x1="40" y1="-10" x2="0" y2="10" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
            </g>
        

    <!-- Bottom accent line -->
    <line x1="50" y1="330" x2="590" y2="330" stroke="#0066FF" stroke-width="2" opacity="0.5"/>
</svg>